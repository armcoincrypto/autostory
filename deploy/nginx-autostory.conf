# Nginx config for STORYFLEET — replace app.name.am with your subdomain (e.g. autostory.name.am)
# Copy to /etc/nginx/sites-available/autostory and:
#   sudo ln -s /etc/nginx/sites-available/autostory /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d app.name.am

server {
    listen 80;
    server_name app.name.am;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
