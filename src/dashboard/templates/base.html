<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}STORYFLEET{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --dark-bg: #1a1a2e;
            --card-bg: #16213e;
        }
        body {
            background-color: var(--dark-bg);
            color: #e4e4e7;
            font-family: 'Inter', sans-serif;
        }
        .sidebar {
            background-color: var(--card-bg);
            min-height: 100vh;
            padding: 20px;
        }
        .sidebar .nav-link {
            color: #a1a1aa;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: var(--primary-color);
            color: white;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #27272a;
            border-radius: 12px;
        }
        .card-header {
            background-color: transparent;
            border-bottom: 1px solid #27272a;
        }
        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
        }
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .table {
            color: #e4e4e7;
        }
        .table thead th {
            border-bottom-color: #27272a;
        }
        .table td, .table th {
            border-color: #27272a;
        }
        .badge-active { background-color: #10b981; }
        .badge-inactive { background-color: #6b7280; }
        .badge-banned { background-color: #ef4444; }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        /* Dark theme: make muted/placeholder text readable */
        .text-muted { color: #94a3b8 !important; }
        .form-control, .form-select { background-color: #1e293b; border-color: #334155; color: #e4e4e7; }
        .form-control::placeholder { color: #64748b; }
        .form-control:focus, .form-select:focus { background-color: #1e293b; border-color: var(--primary-color); color: #e4e4e7; }
        .form-label { color: #d4d4d8; }
        .modal-content.bg-dark { background-color: var(--card-bg) !important; color: #e4e4e7; }
        .modal-content .form-control, .modal-content .form-select { background-color: #1e293b; color: #e4e4e7; }
        /* Empty/loading states - high visibility */
        .scheduler-empty, .scheduler-loading { color: #cbd5e1 !important; font-size: 1.1rem; }
        .scheduler-empty .scheduler-empty-icon { font-size: 3rem; opacity: 0.8; color: var(--primary-color) !important; }
        /* Template preview box */
        #template-preview, .template-preview-box { background-color: #1e293b !important; color: #e4e4e7 !important; border: 1px solid #334155; }
        .form-check-label { color: #d4d4d8; }
        /* Nav tabs on dark */
        .nav-tabs { border-bottom-color: #334155; }
        .nav-tabs .nav-link { color: #94a3b8; }
        .nav-tabs .nav-link:hover { color: #e4e4e7; border-color: transparent; }
        .nav-tabs .nav-link.active { color: #fff; background-color: var(--card-bg); border-color: #334155 #334155 var(--card-bg); }
        /* Modal selects: allow dropdown to show above modal */
        .modal-body { overflow: visible !important; }
        .modal .form-select { min-height: 2.5rem; cursor: pointer; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <div class="logo">
                    <i class="bi bi-broadcast"></i> STORYFLEET
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                    <a class="nav-link {% if request.path == '/accounts' %}active{% endif %}" href="/accounts">
                        <i class="bi bi-people"></i> Accounts
                    </a>
                    <a class="nav-link {% if request.path == '/stories' %}active{% endif %}" href="/stories">
                        <i class="bi bi-collection-play"></i> Stories
                    </a>
                    <a class="nav-link {% if request.path == '/discovery' %}active{% endif %}" href="/discovery">
                        <i class="bi bi-search"></i> Discovery
                    </a>
                    <a class="nav-link {% if request.path == '/campaigns' %}active{% endif %}" href="/campaigns">
                        <i class="bi bi-megaphone"></i> Campaigns
                    </a>
                    <a class="nav-link {% if request.path == '/scheduler' %}active{% endif %}" href="/scheduler">
                        <i class="bi bi-calendar-week"></i> Scheduler
                    </a>
                    <a class="nav-link mt-auto" href="{{ url_for('auth.logout') }}" title="Log out">
                        <i class="bi bi-box-arrow-right"></i> Log out
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 py-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    (function() {
        var _fetch = window.fetch;
        window.fetch = function(url, opts) {
            opts = opts || {};
            opts.credentials = opts.credentials || 'same-origin';
            var urlStr = typeof url === 'string' ? url : (url && url.url) || '';
            return _fetch.apply(this, arguments).then(function(r) {
                if (urlStr.indexOf('/api/') === -1) return r;
                if (r.status === 403) {
                    var next = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = '/login?next=' + next;
                    return Promise.reject(new Error('Auth required'));
                }
                if (r.status >= 500) {
                    console.error('API error:', r.status, r.statusText, urlStr);
                }
                return r;
            });
        };
    })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
