<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}STORYFLEET{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --dark-bg: #1a1a2e;
            --card-bg: #16213e;
        }
        body {
            background-color: var(--dark-bg);
            color: #e4e4e7;
            font-family: 'Inter', sans-serif;
        }
        .sidebar {
            background-color: var(--card-bg);
            min-height: 100vh;
            padding: 20px;
        }
        .sidebar .nav-link {
            color: #a1a1aa;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: var(--primary-color);
            color: white;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #27272a;
            border-radius: 12px;
        }
        .card-header {
            background-color: transparent;
            border-bottom: 1px solid #27272a;
        }
        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
        }
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .table {
            color: #e4e4e7;
        }
        .table thead th {
            border-bottom-color: #27272a;
        }
        .table td, .table th {
            border-color: #27272a;
        }
        .badge-active { background-color: #10b981; }
        .badge-inactive { background-color: #6b7280; }
        .badge-banned { background-color: #ef4444; }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <div class="logo">
                    <i class="bi bi-broadcast"></i> STORYFLEET
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                    <a class="nav-link {% if request.path == '/accounts' %}active{% endif %}" href="/accounts">
                        <i class="bi bi-people"></i> Accounts
                    </a>
                    <a class="nav-link {% if request.path == '/stories' %}active{% endif %}" href="/stories">
                        <i class="bi bi-collection-play"></i> Stories
                    </a>
                    <a class="nav-link {% if request.path == '/discovery' %}active{% endif %}" href="/discovery">
                        <i class="bi bi-search"></i> Discovery
                    </a>
                    <a class="nav-link {% if request.path == '/campaigns' %}active{% endif %}" href="/campaigns">
                        <i class="bi bi-megaphone"></i> Campaigns
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 py-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
