{% extends "base.html" %}

{% block title %}Campaigns - STORYFLEET{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-megaphone"></i> Campaigns</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createCampaignModal">
        <i class="bi bi-plus-circle"></i> New Campaign
    </button>
</div>

<!-- Campaigns Grid -->
<div class="row" id="campaigns-grid">
    <div class="col-12 text-center text-muted py-5">Loading campaigns...</div>
</div>

<!-- Create Campaign Modal -->
<div class="modal fade" id="createCampaignModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark">
            <div class="modal-header">
                <h5 class="modal-title">Create New Campaign</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Campaign Name</label>
                            <input type="text" class="form-control" id="campaign-name" placeholder="My Campaign">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="campaign-description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Target Channels (for discovery)</label>
                            <textarea class="form-control" id="campaign-channels" rows="3" placeholder="@channel1&#10;@channel2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Media Files (paths)</label>
                            <textarea class="form-control" id="campaign-media" rows="2" placeholder="/path/to/media1.jpg&#10;/path/to/media2.mp4"></textarea>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary w-100" onclick="createCampaign()">
                    <i class="bi bi-check-circle"></i> Create Campaign
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadCampaigns() {
    var grid = document.getElementById('campaigns-grid');
    if (!grid) return;
    try {
        var response = await fetch('/api/campaigns', { credentials: 'same-origin' });
        var ct = (response.headers.get('content-type') || '');
        if (ct.indexOf('application/json') === -1) {
            throw new Error('Server returned non-JSON. Check backend.');
        }
        var campaigns = [];
        try {
            campaigns = await response.json();
        } catch (e) {
            throw new Error('Invalid JSON: ' + (e.message || String(e)));
        }
        if (!response.ok) {
            var err = (campaigns && campaigns.error) ? campaigns.error : response.statusText;
            throw new Error(err || 'Request failed');
        }
        if (!Array.isArray(campaigns)) campaigns = [];

        if (campaigns.length === 0) {
            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-megaphone" style="font-size: 3rem; opacity: 0.5;"></i>
                    <p class="mt-3 text-muted">No campaigns yet. Create your first campaign!</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = campaigns.map(c => `
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title">${c.name}</h5>
                            <span class="badge ${c.is_active ? 'bg-success' : 'bg-secondary'}">
                                ${c.is_active ? 'Active' : 'Paused'}
                            </span>
                        </div>
                        <div class="row text-center mb-3">
                            <div class="col-6">
                                <h4>${c.total_stories}</h4>
                                <small class="text-muted">Stories</small>
                            </div>
                            <div class="col-6">
                                <h4>${c.total_mentions}</h4>
                                <small class="text-muted">Mentions</small>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary flex-grow-1" onclick="toggleCampaign(${c.id}, ${c.is_active})">
                                <i class="bi bi-${c.is_active ? 'pause' : 'play'}"></i>
                                ${c.is_active ? 'Pause' : 'Activate'}
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteCampaign(${c.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-footer text-muted">
                        <small>Created: ${new Date(c.created_at).toLocaleDateString()}</small>
                    </div>
                </div>
            </div>
        `).join('');

    } catch (error) {
        console.error('Failed to load campaigns:', error);
        grid.innerHTML = '<div class="col-12 text-center py-5 text-danger"><strong>Failed to load campaigns:</strong> ' + String((error && error.message) || error).replace(/</g, '&lt;') + '</div>';
    }
}

async function createCampaign() {
    const name = document.getElementById('campaign-name').value;
    const description = document.getElementById('campaign-description').value;
    const channels = document.getElementById('campaign-channels').value.split('\n').filter(c => c.trim());
    const media = document.getElementById('campaign-media').value.split('\n').filter(m => m.trim());

    if (!name) {
        alert('Campaign name is required');
        return;
    }

    try {
        const response = await fetch('/api/campaigns', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name,
                description,
                target_chats: channels,
                media_files: media
            })
        });
        const result = await response.json();

        if (result.success) {
            alert('Campaign created!');
            location.reload();
        } else {
            alert('Error: ' + (result.error || 'Unknown error'));
        }
    } catch (error) {
        alert('Failed: ' + error);
    }
}

async function toggleCampaign(id, isActive) {
    try {
        await fetch(`/api/campaigns/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ is_active: !isActive })
        });
        loadCampaigns();
    } catch (error) {
        alert('Failed to update: ' + error);
    }
}

async function deleteCampaign(id) {
    if (!confirm('Are you sure you want to delete this campaign?')) return;

    try {
        await fetch(`/api/campaigns/${id}`, { method: 'DELETE' });
        loadCampaigns();
    } catch (error) {
        alert('Failed to delete: ' + error);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadCampaigns);
} else {
    loadCampaigns();
}
</script>
{% endblock %}
