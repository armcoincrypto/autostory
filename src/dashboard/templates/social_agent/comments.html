{% extends "social_agent/shell.html" %}
{% block sa_content %}
<section class="sa-card">
  <div class="sa-toolbar">
    <div>
      <h2 class="mb-1">Comments</h2>
      <p class="sa-muted mb-0">Provider-abstracted threads. No polling. No fake comments.</p>
    </div>
  </div>
  <div class="sa-gate-banner" role="note">Replies fail-closed until a provider adapter is configured.</div>
  <div id="sa-comments" class="mt-3">Loading…</div>
</section>
{% endblock %}
{% block sa_scripts %}
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const el = document.getElementById("sa-comments");
  el.innerHTML = SocialAgent.ui.loadingHtml();
  try {
    const data = await SocialAgent.fetch("/comments");
    el.innerHTML = SocialAgent.ui.emptyHtml("No comments available", data.message || "Inbox stays empty until providers sync.");
  } catch (e) {
    el.innerHTML = SocialAgent.ui.errorHtml(e.message);
  }
});
</script>
{% endblock %}
