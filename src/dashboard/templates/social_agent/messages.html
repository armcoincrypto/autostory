{% extends "social_agent/shell.html" %}
{% block sa_content %}
<section class="sa-card">
  <div class="sa-toolbar">
    <div>
      <h2 class="mb-1">Agent inbox</h2>
      <p class="sa-muted mb-0">Social Agent conversation architecture (not owner Telegram Messages). No provider writes.</p>
    </div>
  </div>
  <div class="sa-gate-banner" role="note">Conversation model is ready; connectors are not configured.</div>
  <div id="sa-messages" class="mt-3">Loading…</div>
</section>
{% endblock %}
{% block sa_scripts %}
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const el = document.getElementById("sa-messages");
  el.innerHTML = SocialAgent.ui.loadingHtml();
  try {
    const data = await SocialAgent.fetch("/messages");
    el.innerHTML = SocialAgent.ui.emptyHtml("No messages available", data.message || "No provider inbox is connected.");
  } catch (e) {
    el.innerHTML = SocialAgent.ui.errorHtml(e.message);
  }
});
</script>
{% endblock %}
