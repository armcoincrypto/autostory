{% extends "social_agent/shell.html" %}
{% block sa_content %}
<section class="sa-card">
  <div class="sa-toolbar">
    <div>
      <h2 class="mb-1">Analytics</h2>
      <p class="sa-muted mb-0">Architecture only. No fabricated metrics.</p>
    </div>
  </div>
  <div class="sa-gate-banner" role="note">Provider adapters return honest empty states until real connectors ship.</div>
  <div id="sa-analytics-cards" class="sa-grid mt-3"></div>
  <div id="sa-analytics-msg" class="mt-3">Loading…</div>
</section>
{% endblock %}
{% block sa_scripts %}
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const cards = document.getElementById("sa-analytics-cards");
  const msg = document.getElementById("sa-analytics-msg");
  cards.innerHTML = "";
  msg.innerHTML = SocialAgent.ui.loadingHtml();
  try {
    const data = await SocialAgent.fetch("/analytics");
    cards.innerHTML = (data.cards || []).map((c) => (
      "<div class='sa-stat'><div class='label'>" + SocialAgent.escapeHtml(c.label) +
      "</div><div class='value'>—</div><div class='sa-muted small'>No analytics available.</div></div>"
    )).join("") || "";
    msg.innerHTML = SocialAgent.ui.emptyHtml("No analytics available", data.message || "Connect providers before expecting metrics.");
  } catch (e) {
    msg.innerHTML = SocialAgent.ui.errorHtml(e.message);
  }
});
</script>
{% endblock %}
