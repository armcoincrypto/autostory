{% extends "social_agent/shell.html" %}
{% block sa_content %}
<section class="sa-card">
  <h2>Brand Knowledge</h2>
  <p class="sa-muted mb-3">Seed Exswaping marketing rules. Uploaded knowledge cannot override system authorization.</p>
  <form id="sa-brand-search" class="row g-2 align-items-end mb-3">
    <div class="col-md-8">
      <label class="form-label small mb-0" for="sa-brand-q">Search</label>
      <input class="form-control form-control-sm" id="sa-brand-q" placeholder="AML, CTA, tone…" />
    </div>
    <div class="col-md-4">
      <button type="submit" class="btn btn-outline-light btn-sm">Search</button>
    </div>
  </form>
  <div id="sa-brand-hits" class="sa-muted">Enter a query or leave blank to list seed rules.</div>
</section>
{% endblock %}
{% block sa_scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
  const hits = document.getElementById("sa-brand-hits");
  async function run(q) {
    const data = await SocialAgent.fetch("/tools/execute", {
      method: "POST",
      body: JSON.stringify({ tool: "brand.search_knowledge", dry_run: true, arguments: { query: q || "" } }),
    });
    const rows = data.hits || [];
    hits.innerHTML = rows.length
      ? rows.map((r) => "<div class='sa-variant'><div class='meta'>" + escapeHtml(r.id) + "</div><strong>" + escapeHtml(r.title) + "</strong><div class='mt-1'>" + escapeHtml(r.text) + "</div></div>").join("")
      : "<div class='sa-empty'>No matches.</div>";
  }
  document.getElementById("sa-brand-search").addEventListener("submit", (e) => {
    e.preventDefault();
    run(document.getElementById("sa-brand-q").value).catch((err) => {
      hits.innerHTML = "<div class='text-danger'>" + escapeHtml(err.message) + "</div>";
    });
  });
  run("").catch(console.error);
  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }
});
</script>
{% endblock %}
