{% extends "social_agent/shell.html" %}
{% block sa_content %}
<section class="sa-card">
  <h2>Content Studio</h2>
  <p class="sa-muted mb-3">One canonical content item with platform variants. Generated content is never auto-published.</p>
  <form id="sa-draft-form" class="row g-2 align-items-end mb-3">
    <div class="col-md-5">
      <label class="form-label small mb-0" for="sa-brief">Brief</label>
      <input class="form-control form-control-sm" id="sa-brief" placeholder="New USDT to AMD direction" required />
    </div>
    <div class="col-md-3">
      <label class="form-label small mb-0" for="sa-langs">Languages</label>
      <select class="form-select form-select-sm" id="sa-langs" multiple size="1">
        <option value="EN" selected>EN</option>
        <option value="RU">RU</option>
        <option value="HY">HY</option>
      </select>
    </div>
    <div class="col-md-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm" id="sa-gen">Generate draft</button>
      <button type="button" class="btn btn-outline-light btn-sm" id="sa-refresh-drafts">Refresh</button>
    </div>
  </form>
  <div id="sa-draft-result" class="mb-3"></div>
</section>

<section class="sa-card">
  <h2>Drafts</h2>
  <div id="sa-draft-list" class="sa-muted">Loading…</div>
</section>
{% endblock %}
{% block sa_scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
  const listEl = document.getElementById("sa-draft-list");
  const resultEl = document.getElementById("sa-draft-result");

  async function loadDrafts() {
    const data = await SocialAgent.fetch("/content");
    const items = data.items || [];
    if (!items.length) {
      listEl.innerHTML = "<div class='sa-empty'>No drafts yet. Generate one above.</div>";
      return;
    }
    listEl.innerHTML = items.map((it) => (
      "<div class='sa-variant'>"
      + "<div class='meta'>#" + it.id + " · " + escapeHtml(it.status) + "</div>"
      + "<strong>" + escapeHtml(it.title || "Untitled") + "</strong>"
      + "<div class='mt-2 d-flex gap-2'>"
      + "<button type='button' class='btn btn-outline-light btn-sm' data-open='" + it.id + "'>Open</button>"
      + "<button type='button' class='btn btn-outline-info btn-sm' data-preview='" + it.id + "'>Dry-run preview</button>"
      + "</div></div>"
    )).join("");
    listEl.querySelectorAll("[data-open]").forEach((btn) => btn.addEventListener("click", () => openDraft(btn.getAttribute("data-open"))));
    listEl.querySelectorAll("[data-preview]").forEach((btn) => btn.addEventListener("click", () => previewDraft(btn.getAttribute("data-preview"))));
  }

  async function openDraft(id) {
    const data = await SocialAgent.fetch("/content/" + id);
    if (!data.ok) {
      resultEl.innerHTML = "<div class='text-danger'>Not found</div>";
      return;
    }
    resultEl.innerHTML = "<h3 class='h6'>Draft #" + data.item.id + " — " + escapeHtml(data.item.title) + "</h3>"
      + (data.variants || []).map((v) => (
        "<div class='sa-variant'><div class='meta'>" + escapeHtml(v.platform) + " · " + escapeHtml(v.language)
        + " · " + v.char_count + " chars</div><div>" + escapeHtml(v.body) + "</div></div>"
      )).join("");
  }

  async function previewDraft(id) {
    const data = await SocialAgent.fetch("/publishing/preview", {
      method: "POST",
      body: JSON.stringify({ content_id: Number(id), destinations: ["telegram", "facebook", "instagram"] }),
    });
    resultEl.innerHTML = "<h3 class='h6'>Dry-run preview</h3><pre class='small text-light mb-0' style='white-space:pre-wrap'>"
      + escapeHtml(JSON.stringify(data, null, 2)) + "</pre>";
  }

  document.getElementById("sa-draft-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const brief = document.getElementById("sa-brief").value.trim();
    const langs = Array.from(document.getElementById("sa-langs").selectedOptions).map((o) => o.value);
    const btn = document.getElementById("sa-gen");
    btn.disabled = true;
    try {
      const data = await SocialAgent.fetch("/tools/execute", {
        method: "POST",
        body: JSON.stringify({
          tool: "content.generate_variants",
          dry_run: false,
          arguments: {
            brief,
            platforms: ["facebook", "instagram", "telegram", "x", "linkedin"],
            languages: langs.length ? langs : ["EN"],
            persist: true,
          },
        }),
      });
      resultEl.innerHTML = "<div class='sa-empty'>Created draft #" + (data.content_id || "?") + ". Nothing published.</div>";
      await openDraft(data.content_id);
      await loadDrafts();
    } catch (err) {
      resultEl.innerHTML = "<div class='text-danger'>" + escapeHtml(err.message) + "</div>";
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("sa-refresh-drafts").addEventListener("click", () => loadDrafts().catch(console.error));
  loadDrafts().catch((e) => { listEl.innerHTML = "<div class='text-danger'>" + escapeHtml(e.message) + "</div>"; });

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }
});
</script>
{% endblock %}
