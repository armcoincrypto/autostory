<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>Login - STORYFLEET</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary-color: #6366f1; --dark-bg: #1a1a2e; --card-bg: #16213e; }
        body { background-color: var(--dark-bg); color: #e4e4e7; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background-color: var(--card-bg); border: 1px solid #27272a; border-radius: 12px; max-width: 380px; }
        .form-control { background-color: #1e293b; border-color: #334155; color: #e4e4e7; }
        .form-control:focus { background-color: #1e293b; border-color: var(--primary-color); color: #e4e4e7; }
        .btn-primary { background-color: var(--primary-color); border-color: var(--primary-color); }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="login-card p-4 w-100">
        <div class="text-center mb-4">
            <div class="logo"><i class="bi bi-broadcast"></i> STORYFLEET</div>
            <p class="text-muted mt-2 small">Admin Dashboard</p>
        </div>
        {% if error %}
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
