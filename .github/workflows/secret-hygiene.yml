name: Secret hygiene

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject tracked secret artifacts and literals
        run: python scripts/audit/check_repository_secrets.py --repo .
      - name: Test secret scanners
        run: python -m pip install pytest && python -m pytest -q tests/test_repository_secret_hygiene.py tests/test_secret_artifact_audit.py
